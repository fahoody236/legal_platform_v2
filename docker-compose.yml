services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: legal_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
    ports:
      # 5433 on the host: another PostgreSQL already holds 5432 on this machine.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
