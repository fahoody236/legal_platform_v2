<!doctype html>
<!--
  lang and dir are set on the root element, not toggled later by script.

  Arabic and right-to-left are the product's defaults, not a mode it switches
  into: the first paint is already correct, and every logical CSS property in
  the stylesheet resolves against this direction. Setting it here also means the
  browser applies bidirectional text handling to everything on the page,
  including form controls and validation messages, without further help.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
